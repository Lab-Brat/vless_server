---
- name: Simple connection test playbook
  hosts: vless_servers
  gather_facts: yes
  tasks:
    - name: Print connection test message
      debug:
        msg: "Successfully connected to {{ inventory_hostname }} ({{ ansible_facts['default_ipv4']['address'] }})"
    
    - name: Display system information
      debug:
        msg:
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Kernel: {{ ansible_facts['kernel'] }}"
          - "Uptime: {{ ansible_facts['uptime_seconds'] | int // 3600 }} hours"

